AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Saakshi - satellite checks of no-burn claims, officer desk, farmer app and WhatsApp

Parameters:
  OfficerPin:
    Type: String
    NoEcho: true
    Description: PIN the village officer view sends with review actions

Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    CodeUri: ../src
    Environment:
      Variables:
        TABLE_NAME: !Ref Table
        BUCKET_NAME: !Ref Bucket
        SARVAM_PARAM: /saakshi/sarvam/api_key

Resources:
  AgentLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      ContentUri: ../layer-agent
      CompatibleRuntimes: [python3.12]
    Metadata:
      BuildMethod: python3.12

  DepsLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      ContentUri: ../layer
      CompatibleRuntimes: [python3.12]
    Metadata:
      BuildMethod: makefile

  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
        - { AttributeName: kind, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: kind-index
          KeySchema:
            - { AttributeName: kind, KeyType: HASH }
            - { AttributeName: pk, KeyType: RANGE }
          Projection: { ProjectionType: ALL }

  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub envhacks-parali-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource:
              - !Sub ${Bucket.Arn}/web/*
              - !Sub ${Bucket.Arn}/blobs/*
              - !Sub ${Bucket.Arn}/tiles/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Cdn}

  Topic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: envhacks-parali-decisions

  ProcessFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: "Saakshi: satellite check, decisions, payouts, daily sweep"
      Handler: parali.aws.process_handler
      Layers: [!Ref DepsLayer]
      Timeout: 600
      MemorySize: 2048
      Environment:
        Variables:
          TOPIC_ARN: !Ref Topic
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - S3CrudPolicy: { BucketName: !Ref Bucket }
        - SSMParameterReadPolicy: { ParameterName: saakshi/* }
        - SNSPublishMessagePolicy: { TopicName: !GetAtt Topic.TopicName }
        - Statement:
            - Effect: Allow
              Action: polly:SynthesizeSpeech
              Resource: "*"
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-ProcessFunction-*
      Events:
        DemoReset:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0 5 * * ? *)
            ScheduleExpressionTimezone: Asia/Kolkata
            Input: '{"demo_reset": true}'
        DailySweep:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(30 1 * * ? *)
            ScheduleExpressionTimezone: Asia/Kolkata
            Input: '{"sweep": true}'

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: "Saakshi: API for the map, officer desk and farmer app"
      Handler: parali.aws.api_handler
      Layers: [!Ref DepsLayer]
      Timeout: 29
      MemorySize: 1024
      Environment:
        Variables:
          PROCESS_FUNCTION: !Ref ProcessFunction
          OFFICER_PIN: !Ref OfficerPin
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - S3CrudPolicy: { BucketName: !Ref Bucket }
        - SSMParameterReadPolicy: { ParameterName: saakshi/* }
        - LambdaInvokePolicy: { FunctionName: !Ref ProcessFunction }
        - Statement:
            - Effect: Allow
              Action: polly:SynthesizeSpeech
              Resource: "*"
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /api/{proxy+}
            Method: ANY

  TilesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: "Saakshi: map tiles of the season"
      Handler: parali.aws_tiles.handler
      Layers: [!Ref DepsLayer]
      Timeout: 900
      MemorySize: 3008
      Policies:
        - S3CrudPolicy: { BucketName: !Ref Bucket }

  AgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: "Saakshi: farmer assistant and WhatsApp"
      Handler: parali.aws_agent.handler
      Layers: [!Ref AgentLayer]
      Timeout: 60                     # API calls are cut at 30 s; a WhatsApp reply runs async and may take longer
      MemorySize: 1024
      Environment:
        Variables:
          PROCESS_FUNCTION: !Ref ProcessFunction
          AGENT_MODEL_ID: us.amazon.nova-2-lite-v1:0
          AGENT_DAILY_TURNS: "400"
          AGENT_TIMEOUT_S: "15"
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - S3CrudPolicy: { BucketName: !Ref Bucket }
        - SSMParameterReadPolicy: { ParameterName: saakshi/* }
        - LambdaInvokePolicy: { FunctionName: !Ref ProcessFunction }
        - Statement:
            - Effect: Allow
              Action: [polly:SynthesizeSpeech, transcribe:StartStreamTranscription,
                       bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream, bedrock:Converse, bedrock:ConverseStream]
              Resource: "*"
            - Effect: Allow               # WhatsApp: the webhook hands each message to an async run of itself
              Action: lambda:InvokeFunction
              Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-AgentFunction-*
      Events:
        Agent:
          Type: HttpApi
          Properties:
            Path: /api/agent
            Method: POST
        Config:
          Type: HttpApi
          Properties:
            Path: /api/config
            Method: GET
        WhatsAppVerify:
          Type: HttpApi
          Properties:
            Path: /api/whatsapp
            Method: GET
        WhatsAppIn:
          Type: HttpApi
          Properties:
            Path: /api/whatsapp
            Method: POST

  Oac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub envhacks-parali-oac-${AWS::StackName}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Cdn:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Parali Check
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_200
        Origins:
          - Id: web
            DomainName: !GetAtt Bucket.RegionalDomainName
            OriginPath: /web
            S3OriginConfig: { OriginAccessIdentity: "" }
            OriginAccessControlId: !GetAtt Oac.Id
          - Id: blobs
            DomainName: !GetAtt Bucket.RegionalDomainName
            S3OriginConfig: { OriginAccessIdentity: "" }
            OriginAccessControlId: !GetAtt Oac.Id
          - Id: api
            DomainName: !Sub ${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com
            CustomOriginConfig: { OriginProtocolPolicy: https-only }
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6        # CachingOptimized
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad      # CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # AllViewerExceptHostHeader
          - PathPattern: /blobs/*
            TargetOriginId: blobs
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          - PathPattern: /tiles/*
            TargetOriginId: blobs
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

Outputs:
  Url:
    Value: !Sub https://${Cdn.DomainName}
  Bucket:
    Value: !Ref Bucket
  Table:
    Value: !Ref Table
  TopicArn:
    Value: !Ref Topic
  DistributionId:
    Value: !Ref Cdn
  TilesFunction:
    Value: !Ref TilesFunction
