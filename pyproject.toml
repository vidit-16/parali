[project]
name = "parali"
version = "0.1.0"
description = "Satellite check for no-burn paddy residue claims"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "rasterio>=1.4",
    "pystac-client>=0.8",
    "shapely>=2.0",
    "pyproj>=3.6",
    "requests>=2.32",
    "pillow>=10",
]

[project.optional-dependencies]
aws = ["boto3>=1.35"]
dev = ["pytest>=8", "pytest-cov>=5"]
plot = ["matplotlib>=3.9"]

[project.scripts]
parali = "parali.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parali"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
